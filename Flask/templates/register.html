<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="row w-100 shadow-lg rounded-3 overflow-hidden bg-white">
            <section class="col-lg-5 bg-primary text-white p-4 p-md-5 d-flex flex-column justify-content-between">
                <div>
                    <div class="d-inline-flex align-items-center justify-content-center bg-white bg-opacity-25 rounded-3 fw-bold fs-4 p-3 mb-4">R</div>
                    <h1 class="display-5 fw-bold mb-3">Join Us Today</h1>
                    <p class="lead mb-0">Create your account with registration form.</p>
                </div>

                <ul class="list-unstyled mt-5 mb-0">
                    <li class="d-flex align-items-center gap-2 mb-3">
                        <span class="badge text-bg-light rounded-pill">1</span>
                        Quick account setup
                    </li>
                    <li class="d-flex align-items-center gap-2 mb-3">
                        <span class="badge text-bg-light rounded-pill">2</span>
                        Secure password entry
                    </li>
                </ul>
            </section>

            <section class="col-lg-7 p-4 p-md-5">
                <h2 class="fw-bold mb-2">Create Account</h2>
                <p class="text-secondary mb-4">Enter your details below to complete your registration.</p>

                <form method="POST" action="{{ url_for('register_confirm') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label fw-semibold">First Name</label>
                            <input type="text" class="form-control form-control-lg" id="first_name" name="first_name" placeholder="Enter first name" autocomplete="given-name" required>
                        </div>

                        <div class="col-md-6">
                            <label for="last_name" class="form-label fw-semibold">Last Name</label>
                            <input type="text" class="form-control form-control-lg" id="last_name" name="last_name" placeholder="Enter last name" autocomplete="family-name" required>
                        </div>

                        <div class="col-12">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
                        </div>

                        <div class="col-12">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control form-control-lg" id="phone" name="phone" placeholder="Enter phone number" autocomplete="tel" required>
                        </div>

                        <div class="col-12">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-4">Register</button>
                    <p class="text-secondary small text-center mt-3 mb-0">Please check your information before submitting.</p>
                </form>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
