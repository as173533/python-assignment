<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Flask Page{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        .page {
            background-color: white;
            padding: 20px;
            max-width: 700px;
            margin: auto;
            border: 1px solid #cccccc;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
        }
    </style>
</head>
<body>
<div class="page">
    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>

    {% block content %}
    {% endblock %}
</div>
</body>
</html>
